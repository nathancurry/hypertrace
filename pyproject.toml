[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hypertrace"
version = "0.1.0"
description = "An auditable historical research harness"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["httpx>=0.27,<1", "pydantic>=2.9,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
hypertrace = "hypertrace.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hypertrace"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
